// k_cockpit 控制面 ↔ agent 通道协议（f-6-01 §5.2）。
//
// 三个唯一事实来源的关系：本文件是**线上的形状**；internal/agent 的
// Operation/Result/Stage 是**控制面内存里的形状**；两者由 hub 与 nodeagent
// 显式翻译。字段号只增不改（兼容承诺：N-1）。
syntax = "proto3";

package kcockpit.agent.v1;

option go_package = "k_cockpit/internal/agentproto;agentproto";

// AgentGateway 是 agent 主动连接的控制面 gRPC 网关。
//
// 连接鉴权分两态：
//   - 无客户端证书：只允许 Register（凭一次性注册令牌换取客户端证书）；
//   - 有客户端证书（CN = agent_id）：全部 RPC 可用，身份即证书 CN。
message RegisterRequest {
  // 一次性注册令牌（明文）。控制面比对 SHA-256 后即销毁哈希。
  string token = 1;
  // agent 自身持久化的身份 ID（uuid）。首次 enroll 可为空，由控制面生成。
  string agent_id = 2;
  string agent_version = 3;
  int32 protocol_version = 4;
  // 首次注册时希望使用的节点名（仅用于创建待接入节点；已存在节点忽略）。
  string requested_name = 5;
}

message RegisterResponse {
  string agent_id = 1;
  // PEM：CA 证书（agent 后续验证服务端）、客户端证书与私钥（后续连接出示）。
  bytes ca_cert = 2;
  bytes client_cert = 3;
  bytes client_key = 4;
  string node_name = 5;
}

// AgentToServer：agent → 控制面，Channel 双向流的上行消息。
message AgentToServer {
  oneof payload {
    Heartbeat heartbeat = 1;
    StageUpdate stage = 2;
    ExecuteResult result = 3;
    // StreamOpened 是 agent 收到 OpenStreamRequest 后回拨 StreamData 前
    // 的应答（告知流已建立或失败）。
    StreamOpened stream_opened = 4;
  }
}

// ServerToAgent：控制面 → agent，Channel 双向流的下行消息。
message ServerToAgent {
  oneof payload {
    ExecuteRequest execute = 1;
    OpenStreamRequest open_stream = 2;
  }
}

message Heartbeat {
  string agent_version = 1;
  int32 protocol_version = 2;
  // 能力自报（声明式点分键，如 vm.create / network.ovs）。未知项控制面忽略。
  repeated string capabilities = 3;
  // 宿主机名，仅展示用。
  string hostname = 4;
}

message ExecuteRequest {
  // 控制面生成的操作唯一标识（阶段与结果按它关联）。
  string op_id = 1;
  string kind = 2;
  string target = 3;
  // Operation.Params 的 JSON 形状（对象）。
  string params_json = 4;
}

// StageUpdate 对应契约 Stage{Key,Name,Index,Total}；Total=0 表示总数未知。
message StageUpdate {
  string op_id = 1;
  string key = 2;
  string name = 3;
  int32 index = 4;
  int32 total = 5;
}

message ExecuteResult {
  string op_id = 1;
  bool success = 2;
  string message = 3;
  // Result.Data 的 JSON 形状（对象；[]byte 字段为 base64，由解码表还原类型）。
  string data_json = 4;
}

message OpenStreamRequest {
  string stream_id = 1;
  // 目前仅 "vnc"。target 为虚拟机名。
  string kind = 2;
  string target = 3;
}

message StreamOpened {
  string stream_id = 1;
  bool ok = 2;
  string message = 3;
}

// StreamData 是与 Channel 独立的字节流 RPC（HTTP/2 流天然多路复用）。
// 内容不落盘、不进日志。
message StreamChunk {
  bytes data = 1;
}

service AgentGateway {
  // 一次性注册（无客户端证书态可用）。
  rpc Register(RegisterRequest) returns (RegisterResponse);
  // 双向通道：心跳上行；执行指令下行；阶段与结果上行。
  rpc Channel(stream AgentToServer) returns (stream ServerToAgent);
  // 字节流（VNC 等）。agent 侧发起：先经 Channel 收到 OpenStreamRequest，
  // 再打开本 RPC，元数据（stream_id）经请求头 x-kc-stream-id 携带。
  rpc StreamData(stream StreamChunk) returns (stream StreamChunk);
}
