# 持续集成（ROADMAP §2.6）。
#
# 两份工作互不依赖、并行跑：后端与前端是两个独立的构建面，一个失败
# 不该掩盖另一个的结论。
#
# 本地跑法（AGENTS.md §3）与这里完全一致：gofmt / vet / test 与
# tsc / lint / test / build——CI 只是把同一组命令放到干净环境里再跑
# 一遍，避免"本地能过、CI 红了"时怀疑环境而不是代码。

name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  # 仅用于失败时上传测试日志 artifact（upload-artifact 需要 actions 写权限）
  actions: write

jobs:
  backend:
    name: 后端（gofmt / vet / test）
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: 安装依赖
        run: go mod download

      - name: 格式化检查
        run: |
          unformatted=$(gofmt -l cmd internal)
          if [ -n "$unformatted" ]; then
            echo "以下文件未通过 gofmt：" >&2
            echo "$unformatted" >&2
            exit 1
          fi

      - name: 静态检查
        run: go vet ./...

      # 测试输出同步落盘：偶发失败（如某次 CI 单测红而同一提交重跑即绿）
      # 时，失败 artifact 里带着完整的 --- FAIL 行，不必再靠猜。
      #
      # 覆盖率门禁：Go 自带工具，不引入新依赖。
      #
      # 口径（两个数字差别很大，别混用）：
      #   - 这里用 `go test ./...` 的**默认口径**：只统计「本包测试覆盖本包」
      #     的语句，没有测试文件的包不计入分母。当前 55.1%。
      #   - 复核时用的 `-coverpkg=./internal/...` 是**跨包口径**：一个包的
      #     代码被别的包的测试覆盖也算。当前 61.x%，更能反映真实覆盖，但
      #     要为全部包插桩，慢一倍。
      # 门禁取默认口径是为了让 CI 保持在分钟级；54 是「不许更低」的守门线，
      # 不是质量目标——它比当前值低约 1 点，留给「新增少量无测试代码」的
      # 正常波动。**要下调这个数字，先在本行写明理由**：它是唯一能挡住
      # 覆盖率缓慢下滑的东西，随手改等于没有门禁。
      - name: 单元测试与覆盖率
        run: |
          set -o pipefail
          go test -coverprofile=/tmp/kc-cover.out ./... 2>&1 | tee /tmp/go-test.log
          total=$(go tool cover -func=/tmp/kc-cover.out | awk '/^total:/ {gsub(/%/, "", $3); print $3}')
          echo "Go 整体行覆盖率（默认口径）: ${total}%"
          awk -v t="$total" 'BEGIN { if (t+0 < 54) { print "覆盖率低于 54% 门槛（当前 " t "%，见 ci.yml 注释里的口径说明）" > "/dev/stderr"; exit 1 } }'

      - name: 上传测试日志（仅失败时）
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: go-test-log-${{ github.run_id }}
          path: /tmp/go-test.log
          retention-days: 14
          if-no-files-found: ignore

  frontend:
    name: 前端（typecheck / lint / test / build）
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 12

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml

      - name: 安装依赖
        run: pnpm install --frozen-lockfile

      - name: 类型检查
        run: pnpm exec tsc -b

      - name: 静态检查
        run: pnpm lint

      - name: 单元测试
        run: pnpm test

      - name: 构建
        run: pnpm build

  e2e:
    name: E2E 冒烟（Playwright，独立控制面 + SQLite）
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - uses: pnpm/action-setup@v4
        with:
          version: 12

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml

      - name: 安装依赖
        run: pnpm --dir web install --frozen-lockfile

      - name: 安装浏览器
        run: pnpm --dir web exec playwright install --with-deps chromium

      # 双 webServer（控制面 + vite）由 playwright 配置自行拉起，
      # 这里只需要跑用例。生产构建不走这里——冒烟跑在 vite 开发服务器上，
      # 与本地开发同一形态。
      - name: 运行冒烟
        run: pnpm --dir web test:e2e
